name: filo
description: "Filo, an AI-assisted learning management app for Android."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  crypto: ^3.0.6
  flutter_secure_storage: ^10.0.0
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  google_sign_in: ^7.2.0
  path: ^1.9.1
  path_provider: ^2.1.6
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/mascots/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
