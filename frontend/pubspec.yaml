name: filo
description: "Filo, an AI-assisted learning management app for Android."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter_animate: ^4.5.2
  dio: ^5.11.0
  pdfrx: ^2.6.5
  open_filex: ^4.7.0
  workmanager: ^0.10.7
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  uuid: ^4.5.1
  crypto: ^3.0.6
  flutter_secure_storage: ^10.0.0
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  google_sign_in: ^7.2.0
  path: ^1.9.1
  path_provider: ^2.1.6
  supabase_flutter: ^2.18.3
  connectivity_plus: ^7.3.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.3

dev_dependencies:
  http: ^1.6.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    # Keep this list in sync when adding mascot PNGs.
    - assets/mascots/waving.png
    - assets/mascots/curious.png
    - assets/mascots/cheerful.png
    - assets/mascots/sleepy.png
    - assets/mascots/thinking.png
    - assets/mascots/confused.png
    - assets/mascots/confused_notepad.png
    - assets/mascots/cheerful_note.png
    - assets/mascots/waiting.png
    - assets/fonts/phosphor/LICENSE
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: FiloPhosphorRegular
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Regular.ttf
    - family: FiloPhosphorFill
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Fill.ttf
